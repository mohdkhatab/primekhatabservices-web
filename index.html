        </p>

        <ul>
          <li>
            App Development — Native Android applications engineered for fast startup,
            offline resilience, smooth media playback, and dependable everyday performance,
            from architecture and build through release packaging and Play Store readiness.
          </li>
          <li>
            Web Development — High-speed web applications, responsive product websites, and
            client portals built with React and TypeScript, with technical SEO, structured
            data, and performance tuning included.
          </li>
          <li>
            AI Integration &amp; AI Agents — Practical AI model integration and task-focused
            agents embedded into existing software and business operations, including
            grounded retrieval, document processing, and tool-calling workflows with human

          </li>
          <li>
            API Development — Durable HTTP APIs, authentication layers, webhook receivers,
            and integration backends that connect mobile apps, web dashboards, payment

          </li>
